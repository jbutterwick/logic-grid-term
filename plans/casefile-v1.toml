# UI contract (the web task codes against exactly this)
```rust
// casefile/src/ui/mod.rs
#[derive(Clone, Copy, PartialEq, Eq, Debug)]
pub enum Key { Up, Down, Left, Right, Enter, Esc, Backspace, Tab, Char(char) }
pub struct App { /* private */ }
impl App {
    /// Start at the setup screen; `seed` seeds the first case unless the player types one.
    pub fn new(seed: u64) -> App;
    /// Skip setup (CLI flags).
    pub fn with_game(game: casefile::Game) -> App;
    pub fn on_key(&mut self, key: Key);
    pub fn render(&self, area: ratatui::layout::Rect, buf: &mut ratatui::buffer::Buffer);
    pub fn quit(&self) -> bool;

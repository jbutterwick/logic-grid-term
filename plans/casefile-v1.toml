# Content rules
- One FrameData per theme title (15 themes: Apartment Block, Dinner Party, Marathon, Flea
  Market, Cul-de-Sac, Harbor, High School, Heist Crew, Haunted Hotel, Space Station,
  Bake-Off, Band Tour, Garden Club, Manor Mystery, Coffee Shop) plus the generic fallback.

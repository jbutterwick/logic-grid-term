```

# Screens (ui/screens/*.rs, one file each, all rendering via Buffer like logictui)
- setup: rows Level < >, Theme < Random | names >, Adult < off | on >, Seed (digits typed,
  Backspace edits, blank = the seed passed to App::new), Start. Show the adult toggle's
  meaning in one muted line: profanity, harsher crimes, innuendo; nothing explicit.
- inbox: left list of threads (Chief first, then each suspect with unread count and a
  "silent" marker), right preview of the selected thread. Top line: case title, tick,
  progress gauge (ratatui Gauge, D2.3) from Game::progress, rank. Keys: j/k or arrows,
  Enter open thread, n notepad, a accuse, w wait for mail, ? help, q quit.
- thread: emails newest last in a scrollable Paragraph (wrap, j/k scroll), From/Subject
  header per email, outgoing mail visually distinct. Keys: c compose (suspect threads only),
  Esc back.
- compose: list of Question::label for Game::questions(suspect); Enter sends via Game::ask
  and returns to the thread; Esc cancels.
- notepad: a suspects x facts table: rows are suspects, column groups are each non-anchor
  category's items; each cell shows Grid mark (· ✗ ●) between the suspect and that item;
  Space/Enter cycles Unknown -> No -> Yes, x/o set, Backspace clears. Tab switches focus to
  the free-text notes box (typing edits Game::notes, Enter newline). Esc back.
- accuse: step 1 pick a suspect, step 2 pick an item in the guilty category, step 3 confirm
  (y). Calls Game::accuse; then returns to inbox where the chief's reply waits. When solved,
  the inbox shows a "Case closed: <rank>" banner.
- help: overlay listing keys; any key closes.

# main.rs (native only for now; keep it small so the web task can add a wasm entry)
- `#[cfg(not(target_arch = "wasm32"))] fn main()`: clap flags `--seed`, `--level`, `--theme`
  (name, case-insensitive), `--adult`; any flag skips setup via App::with_game. Seed defaults
  to nanoseconds since the epoch. `ratatui::init()`, loop draw + crossterm key events mapped
  to `Key`, exit when App::quit. Restore the terminal on panic.
- `#[cfg(target_arch = "wasm32")] fn main() {}` placeholder with a `// web task` comment.

# Done when
- `cargo run -p casefile -- --level easy --seed 1` plays a full case: ask, press, notepad,
  accuse, chief reply, banner.
- Tests (Buffer renders, no terminal): setup -> inbox flow via on_key; inbox renders at
  80x24 and 120x40 without panic for each Level; compose sends and a reply appears after
  the next action; notepad cycling updates Game::grid; accuse flow reaches solved on the
  culprit; Key mapping for clap-free paths.
- fmt, test, clippy clean per the plan header; `cargo build -p casefile --lib --target
  wasm32-unknown-unknown` still succeeds (the lib must not pull crossterm).
- Committed on your branch with no AI attribution trailer. Run `corps task complete`.
"""


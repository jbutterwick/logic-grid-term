# Public API contract (the tui, content, and web tasks code against exactly this; keep names)
```rust
// lib.rs re-exports everything below plus `pub use logicgrid::{Cat, Clue, Entity, Grid, Item, Mark, Puzzle};`
// and `pub fn theme_names() -> Vec<&'static str>` (wraps logicgrid::theme_names).
#![deny(missing_docs)]

#[derive(Clone, Copy, PartialEq, Eq, Debug, Serialize, Deserialize)]
pub enum Level { Easy, Medium, Hard }
impl std::str::FromStr for Level { /* "easy"|"medium"|"hard", case-insensitive */ }
impl Level {
    pub fn size(self) -> logicgrid::Size;            // Easy 3x4, Medium 4x4, Hard 5x5
    pub fn difficulty(self) -> logicgrid::Difficulty; // Easy, Medium, Hard
    pub fn liars(self) -> usize;                      // 0, 1, 2
    pub fn culprit_lies(self) -> bool;                // false, false, true
    pub fn subtle_tells(self) -> bool;                // false, false, true
    pub fn name(self) -> &'static str;                // "easy" | "medium" | "hard"
}

#[derive(Clone, Copy, PartialEq, Eq, Debug, Serialize, Deserialize)]
pub enum Mood { Cooperative, Nervous, Hostile, Chatty }

#[derive(Clone, Debug, Serialize, Deserialize)]
pub struct Settings { pub seed: u64, pub level: Level, pub theme: Option<usize>, pub adult: bool }

#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
pub struct Statement { pub clue: Clue, pub truthful: bool, pub revealed: bool }

#[derive(Clone, Debug, Serialize, Deserialize)]
pub struct Suspect {
    pub name: String,            // anchor item display name
    pub email: String,           // "<name lowercased>@<frame.domain>"
    pub liar: bool,
    pub mood: Mood,
    pub conscience: bool,        // feels guilty: hedges in replies
    pub statements: Vec<Statement>,
    pub silenced: bool,          // stops replying after being wrongly accused
}

/// Theme framing resolved for this case (from content.rs; adult variants already applied).
#[derive(Clone, Debug, Serialize, Deserialize)]
pub struct Frame {
    pub title: String,           // puzzle.title, e.g. "Manor Mystery"
    pub domain: String,          // email domain, e.g. "thornfield.manor"
    pub chief: String,           // display name of the player's boss, e.g. "DCI Marlowe"
    pub setting: String,         // 2-4 sentences: what happened. Must not name a category.
    pub crime: String,           // short noun phrase, e.g. "the theft", "the poisoning"
}

#[derive(Clone, Debug, Serialize, Deserialize)]
pub struct Case {
    pub settings: Settings,
    pub puzzle: Puzzle,          // logicgrid::generate(level.size(), level.difficulty(), seed, theme)
    pub suspects: Vec<Suspect>,  // one per anchor item, same order
    pub guilty: Entity,          // the guilty fact: a non-anchor entity chosen from the seed
    pub culprit: usize,          // anchor item the solution pairs with `guilty`
    pub frame: Frame,
}
impl Case {
    pub fn new(settings: Settings) -> Case;
    /// "was in the Study": guilty category phrase with the item filled in.
    pub fn guilty_fact(&self) -> String;
    /// Anchor category name lowercased, e.g. "guest".
    pub fn noun(&self) -> String;
}

// text.rs
/// Render a clue as prose. `speaker = Some(i)` renders in first person for suspect i
/// ("I was in the Study", "I'm not the guest who gave the Wine", "Crane and I sat next
/// to each other"). `variant` picks among 2-3 wordings; any usize is valid (mod).
pub fn render(clue: &Clue, p: &Puzzle, speaker: Option<usize>, variant: usize) -> String;
/// Third-person-singular verb phrase to first person: "owns the Cat" -> "own the Cat",
/// "is bound to" -> "am bound to", "has" -> "have", "flies" -> "fly", "was" -> "was".
pub fn first_person(phrase: &str) -> String;

// content.rs (placeholder now; `content` task rewrites). Keep these signatures exactly.
pub struct FrameData {
    pub theme: &'static str, pub domain: &'static str, pub chief: &'static str,
    pub setting: &'static str, pub setting_adult: &'static str,
    pub crime: &'static str, pub crime_adult: &'static str,
}
/// Frame for a theme title; unknown titles get a generic frame.
pub fn frame(theme: &str) -> &'static FrameData;
pub struct VoiceData {
    pub mood: Mood,
    pub openers: &'static [&'static str], pub openers_adult: &'static [&'static str],
    pub closers: &'static [&'static str], pub closers_adult: &'static [&'static str],
    /// Non-answers when the suspect has nothing left on a topic.
    pub dodges: &'static [&'static str], pub dodges_adult: &'static [&'static str],
    /// Pressed on a truthful statement; "{stmt}" is replaced with the verbatim statement.
    pub press_true: &'static [&'static str],
    /// Pressed on a false statement; "{stmt}" is replaced with a re-rendered variant.
    pub press_false: &'static [&'static str], pub press_false_subtle: &'static [&'static str],
    /// Extra hedge sentence when `conscience` is set.
    pub conscience: &'static [&'static str], pub conscience_adult: &'static [&'static str],
}
pub fn voice(mood: Mood) -> &'static VoiceData;
/// Chief email templates. Placeholders: {setting} {crime} {names} {fact} {noun} {rank}
/// {epilogue} {culprit} {chief}.
pub struct ChiefData { pub intro: &'static str, pub nudge: &'static str, pub wrong: &'static str, pub solved: &'static str }
pub fn chief(adult: bool) -> &'static ChiefData;

// game.rs
#[derive(Clone, Copy, PartialEq, Eq, Debug, Serialize, Deserialize)]
pub enum Question { Own, About(usize), Category(Cat), Press }
impl Question {
    /// Menu label: "Where were you that night?", "What do you know about Crane?",
    /// "Tell me about the Motive.", "Press on your last answer."
    pub fn label(&self, case: &Case) -> String;
}
#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
pub struct Email { pub from: String, pub subject: String, pub body: String, pub tick: u32, pub read: bool, pub outgoing: bool }
#[derive(Clone, Copy, PartialEq, Eq, Debug, Serialize, Deserialize)]
pub enum Rank { Inspector, Detective, Constable }   // 0 wrong accusations, 1, 2+
#[derive(Clone, Debug, Serialize, Deserialize)]
pub struct Game {
    pub case: Case,
    pub tick: u32,
    pub chief: Vec<Email>,          // thread with the chief; starts with the intro email
    pub threads: Vec<Vec<Email>>,   // one per suspect
    pub grid: Grid,                 // notepad marks, logicgrid::Grid::new(&case.puzzle)
    pub notes: String,              // free-text notepad
    pub wrong: u32,
    pub presses: u32,
    pub solved: bool,
    // private: pending replies (due tick, thread, Email), last statement index per suspect, nudged flag
}
impl Game {
    pub fn new(settings: Settings) -> Game;
    /// Own, About(every other suspect), Category(every non-anchor category), then Press if
    /// the suspect has answered at least once. Empty if the suspect is silenced.
    pub fn questions(&self, suspect: usize) -> Vec<Question>;
    /// Append the outgoing email, queue the reply for tick+1, advance the tick, deliver due mail.
    pub fn ask(&mut self, suspect: usize, q: Question);
    /// Advance the tick and deliver due mail.
    pub fn wait(&mut self);
    /// True when suspect == culprit and fact == guilty. Wrong: wrong += 1, accused silenced,
    /// chief sends `wrong`. Right: solved = true, chief sends `solved` with rank and epilogue.
    pub fn accuse(&mut self, suspect: usize, fact: Entity) -> bool;
    /// (truthful statements revealed, truthful statements total).
    pub fn progress(&self) -> (usize, usize);
    pub fn rank(&self) -> Rank;
    /// Unread count; None = chief thread.
    pub fn unread(&self, thread: Option<usize>) -> usize;
    /// Mark every email in the thread read.
    pub fn mark_read(&mut self, thread: Option<usize>);
    /// Full solution as prose, one sentence per suspect, e.g.
    /// "Crane was in the Study, was last seen at Midnight, and is driven by Greed."
    pub fn epilogue(&self) -> String;
    pub fn to_json(&self) -> String;
    pub fn from_json(s: &str) -> Result<Game, serde_json::Error>;
}
```

# Case generation rules (D1.2-D1.5)
- `StdRng::seed_from_u64(seed ^ 0xCA5E)` drives every choice below, in a fixed order, so the
  case is deterministic.
- Guilty fact: pick a non-anchor category, then an item. culprit = position of that item in
  `solution.0[cat]`.
- Liars: choose `level.liars()` suspects at random; on Hard the culprit is always one of them.
  Moods and conscience are random per suspect (conscience biased true for the culprit).
- Distribute every clue in `puzzle.clues` as a truthful statement: if the clue mentions an
  anchor entity, give it to that suspect (the first one mentioned); otherwise give it to the
  suspect with the fewest statements so far (ties broken by rng). Truthful statements alone
  therefore always solve the case.
- False statements for each liar (2 on Medium, 3 on Hard): `Clue::Is(self, wrong item)` or
  `Clue::IsNot(self, true item)` about the liar's own facts, or `Clue::Is(other suspect,
  wrong item)`. Verify each is false under the solution with `Clue::holds`. If
  `level.culprit_lies()`, the culprit's first false statement is `Is(culprit, wrong item in
  the guilty category)`. Shuffle each suspect's statements.
- Question matching: Own matches a statement mentioning the speaker; About(s) one mentioning
  suspect s; Category(c) one mentioning any entity in category c. `ask` reveals the first
  unrevealed match, else a dodge. Press repeats the last revealed statement from that suspect:
  truthful -> `press_true` with the verbatim text; false -> `press_false` (or
  `press_false_subtle` when `level.subtle_tells()`) with `render(.., variant + 1)`.
- Reply body = opener + " " + statement/dodge + (conscience hedge) + "\n\n" + closer, all
  drawn from `voice(mood)` with adult variants when `settings.adult`.
- Chief: intro on `Game::new` (uses frame.setting, suspect names, guilty_fact, frame.crime);
  nudge once when progress passes half; wrong / solved on accusation.
- Placeholder content.rs: one generic FrameData, one VoiceData per mood with two entries per
  list (clean and adult may be identical), one ChiefData. Enough to run; the content task
  replaces it. Mark the file `// PLACEHOLDER: rewritten by the content task`.

# Done when
- Tests: determinism (same Settings twice -> identical to_json); every Level x 5 seeds
  generates a Case whose truthful statements solve to `SolveResult::Unique(puzzle.solution)`
  via `logicgrid::solve` and whose false statements each fail `Clue::holds`; liar counts match
  the level; culprit pairs with guilty; `first_person` covers the verbs in
  logicgrid/src/themes.rs (owns, is, has, flies, was, arrived, claims); `render` with a
  speaker never yields "I is", "I owns", "is I", or "who I"; `ask` delivers on the next
  action; Press on truthful repeats verbatim and on false differs; accuse right/wrong paths;
  progress and rank.
- `cargo build -p casefile --lib --target wasm32-unknown-unknown` succeeds.
- Every pub item documented; fmt, test, clippy clean per the plan header.
- Committed on your branch with no AI attribution trailer. Run `corps task complete`.
"""


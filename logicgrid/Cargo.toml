[package]
name = "logicgrid"
description = "Logic grid puzzle generator and solver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/jbutterwick/logic-grid-term"
readme = "../README.md"
keywords = ["puzzle", "logic", "generator", "solver"]
categories = ["games", "algorithms"]

[dependencies]
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "casefile"
description = "An email-inbox detective game of logical deduction, in the terminal or the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/jbutterwick/logic-grid-term"
homepage = "https://jbutterwick.github.io/logic-grid-term/"
readme = "README.md"
keywords = ["game", "puzzle", "detective", "tui", "wasm"]
categories = ["games", "command-line-utilities", "wasm"]

[dependencies]
logicgrid = { path = "../logicgrid", version = "0.1.0" }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratatui = { version = "0.30", default-features = false, features = ["std"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "Node",
    "UrlSearchParams",
    "Window",
    "console",
] }
